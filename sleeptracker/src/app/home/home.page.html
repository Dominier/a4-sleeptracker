<ion-header [translucent]="true">
  <ion-toolbar color = "primary">
    <ion-title>
      Sleep Tracker
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Sleep Tracker</ion-title>
    </ion-toolbar>
  </ion-header>
<!--log sleep card-->
  <ion-card>
    <ion-card-header>
      <ion-card-title>Log last night's sleep</ion-card-title>
    </ion-card-header>

    <ion-card-content>
      <ion-list>
        <ion-item> <!--user selects date and time for bedtime and wake time-->
          <ion-label>Your Bedtime</ion-label>
          <ion-datetime-button datetime="bedtimePicker" slot="end"></ion-datetime-button>
        </ion-item>
        <ion-item>
          <ion-label>Your Wake Time</ion-label>
          <ion-datetime-button datetime="wakePicker" slot="end"></ion-datetime-button>
        </ion-item>
      </ion-list>

      <!-- the pop-up calendars -->
      <ion-modal [keepContentsMounted]="true">
        <ng-template>
          <ion-datetime id="bedtimePicker" [(ngModel)]="bedtime" [showDefaultButtons]="true"></ion-datetime>
        </ng-template>
      </ion-modal>
      <ion-modal [keepContentsMounted]="true">
        <ng-template>
          <ion-datetime id="wakePicker" [(ngModel)]="wakeTime" [showDefaultButtons]="true"></ion-datetime>
        </ng-template>
      </ion-modal>
      @if (!isSleepValid()){
        <p class="error-text"> Your wake up time should be after your bed time.</p>
      }
      <ion-button expand="block" [disabled]="!isSleepValid()" (click)="saveSleep()">Save sleep</ion-button>
    </ion-card-content>
  </ion-card>
  <!--log sleepiness card-->
  <ion-card>
    <ion-card-header>
      <ion-card-title>How sleepy are you feeling?</ion-card-title>
    </ion-card-header>

    <ion-card-content>
      <!--slider from 1 (wide awake) to 7 (almost asleep) -->
      <ion-range min="1" max="7" step="1" [snaps]="true" [ticks]="true" [pin]="true" [(ngModel)]="sleepiness">
        <ion-icon slot="start" name="sunny"></ion-icon>
        <ion-icon slot="end" name="moon"></ion-icon>
      </ion-range>

      <!--Stanford Sleepiness Scale ; what number means-->
      <p class="scale-text">{{ sleepiness }}: {{ sleepinessDescription }}</p>

      <ion-list>
        <ion-item>
          <ion-label>Time</ion-label>
          <ion-datetime-button datetime="sleepinessPicker" slot="end"></ion-datetime-button>
        </ion-item>
      </ion-list>

      <!--pop-up calendar for sleepiness time -->
      <ion-modal [keepContentsMounted]="true">
        <ng-template>
          <ion-datetime id="sleepinessPicker" [(ngModel)]="sleepinessTime" [showDefaultButtons]="true"></ion-datetime>
        </ng-template>
      </ion-modal>

      <ion-button expand="block" (click)="saveSleepiness()">Save sleepiness</ion-button>
    </ion-card-content>
  </ion-card>
</ion-content>
