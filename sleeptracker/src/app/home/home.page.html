<ion-header [translucent]="true">
  <ion-toolbar color = "primary">
    <ion-title>
      Sleep Tracker
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Sleep Tracker</ion-title>
    </ion-toolbar>
  </ion-header>
<!--log sleep card-->
  <ion-card>
    <ion-card-header>
      <ion-card-title>Log your sleep from last night</ion-card-title>
    </ion-card-header>

    <ion-card-content>
      <h2>I slept at</h2>
      <ion-datetime presentation="date-time" [preferWheel]="true" [(ngModell)]="wakeTime"></ion-datetime>
      @if (!isSleepValid()){
        <p class="error-text"> Your wake up time should be after your bed time.</p>
      }
      <ion-button expand="block" [disabled]="!isSleepValid()" (click)="saveSleep()">Save sleep</ion-button>
    </ion-card-content>
  </ion-card>
</ion-content>
