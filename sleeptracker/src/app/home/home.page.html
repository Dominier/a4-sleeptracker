<ion-header [translucent]="true">
  <ion-toolbar color = "primary">
    <ion-title>
      Sleep Tracker
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Sleep Tracker</ion-title>
    </ion-toolbar>
  </ion-header>
<!--log sleep card-->
  <ion-card>
    <ion-card-header>
      <ion-card-title>Log last night's sleep</ion-card-title>
    </ion-card-header>

    <ion-card-content>
      <ion-list>
        <ion-item> <!--user selects date and time for bedtime and wake time-->
          <ion-label>Your Bedtime</ion-label>
          <ion-datetime-button datetime="bedtimePicker" slot="end"></ion-datetime-button>
        </ion-item>
        <ion-item>
          <ion-label>Your Wake Time</ion-label>
          <ion-datetime-button datetime="wakePicker" slot="end"></ion-datetime-button>
        </ion-item>
      </ion-list>

      <!-- the pop-up calendars -->
      <ion-modal [keepContentsMounted]="true">
        <ng-template>
          <ion-datetime id="bedtimePicker" [(ngModel)]="bedtime" [showDefaultButtons]="true"></ion-datetime>
        </ng-template>
      </ion-modal>
      <ion-modal [keepContentsMounted]="true">
        <ng-template>
          <ion-datetime id="wakePicker" [(ngModel)]="wakeTime" [showDefaultButtons]="true"></ion-datetime>
        </ng-template>
      </ion-modal>
      @if (!isSleepValid()){
        <p class="error-text"> Your wake up time should be after your bed time.</p>
      }
      <ion-button expand="block" [disabled]="!isSleepValid()" (click)="saveSleep()">Save sleep</ion-button>
    </ion-card-content>
  </ion-card>
</ion-content>
